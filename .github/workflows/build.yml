name: Build apps
on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win --x64
            glob: desktop/dist/*.exe
          - os: macos-latest
            args: --mac --x64 --arm64
            glob: |
              desktop/dist/*.dmg
              desktop/dist/*.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Copy shared scripts
        shell: bash
        run: |
          mkdir -p desktop/scripts
          cp shared/hbtest.js desktop/scripts/
      - name: Build
        working-directory: desktop
        run: |
          npm install
          npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.glob }}

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Copy shared scripts
        run: |
          mkdir -p android/app/src/main/assets
          cp shared/hbtest.js android/app/src/main/assets/
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/*.apk
